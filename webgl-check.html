<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HexGL: 3D Racing — WebGL check</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      color: #e8f4ff;
      font-family: system-ui, sans-serif;
    }
    body { display: flex; align-items: center; justify-content: center; }
    .box { max-width: 520px; padding: 24px; text-align: center; }
    .ok { color: #3dffb5; }
    .bad { color: #ff4d6d; }
    a { color: #3ec8ff; }
  </style>
</head>
<body>
  <div class="box">
    <h1>WebGL check</h1>
    <div id="out">Checking…</div>
    <p>If WebGL fails, enable hardware acceleration in your browser, then reload this page.</p>
    <p><a href="index.html">← Back to HexGL: 3D Racing</a></p>
  </div>
  <script>
    (function () {
      var out = document.getElementById('out');
      var canvas = document.createElement('canvas');
      var gl = null;
      try { gl = canvas.getContext('webgl', { failIfMajorPerformanceCaveat: false }) || canvas.getContext('experimental-webgl'); } catch (e) {}
      if (gl) {
        out.innerHTML = '<p class="ok">WebGL OK</p>';
      } else {
        out.innerHTML = '<p class="bad">WebGL unavailable in this browser context.</p>';
      }
    })();
  </script>
</body>
</html>
